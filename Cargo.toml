[workspace]
resolver = "2"
# Product groups:
#   gentl/   universal GenTL producer (.cti)
#   gateway/ Linux relay gateway + camera backends + CLI
#   virtual/ virtual GigE/U3V fronts and the Null source
members = [
    "gentl/core",
    "gentl/gvcp",
    "gentl/gige",
    "gentl/simulator",
    "gentl/u3v",
    "gentl/packager",
    "gateway/core",
    "gateway/backends/gige",
    "gateway/backends/u3v",
    "gateway/cli",
    "virtual/gige",
    "virtual/u3v",
    "virtual/null",
]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2021"
