[package]
name = "gentl-simulator"
description = "Software-simulated GigE Vision camera (GVCP responder + fixed register map + fake stream)"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
gentl-core = { path = "../gentl-core" }
gentl-gvcp = { path = "../gentl-gvcp" }
# IP_DONTFRAGMENT for the §24.5 test packet (setsockopt on the stream sink).
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }
