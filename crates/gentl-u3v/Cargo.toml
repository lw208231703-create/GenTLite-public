[package]
name = "gentl-u3v"
description = "USB3 Vision GenTL producer (.cti): WinUSB (Windows) / libusb (Unix) backend + GenCP control + U3V streaming"
version.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "gentl_u3v"

[dependencies]
gentl-core = { path = "../gentl-core" }
# ZIPped camera XML (manifest file format 1, GenCP §5.5.1.2)
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# WinUSB backend.
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Usb",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Linux/Unix USB backend (Phase B, notes/PENDING.md "Linux 可移植"):
# links the system libusb (usbfs) — no vendored C sources.
rusb = "0.9"
