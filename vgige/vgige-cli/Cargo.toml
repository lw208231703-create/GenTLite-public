[package]
name = "vgige-cli"
description = "vgige gateway binary: argument parsing, up/down NIC assembly (back-gige + core + front-gige), signal handling"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
# The binary links one camera backend AND one front. The one forbidden
# combination is back-gige + front-u3v: gentl-gige and gentl-u3v export
# the same #[no_mangle] GenTL symbols, so both in one image collide
# (MSVC LNK2005 / GNU ld). Everything else links; the compile_error
# below turns the forbidden pair into a clean build failure. Deployments:
#   GigE gateway:        default
#   U3V camera → GigE:   --no-default-features --features back-u3v,front-gige
#   GigE camera → U3V:   impossible (the collision) — by design v1
#   U3V camera → U3V:    --no-default-features --features back-u3v,front-u3v
default = ["back-gige", "front-gige"]
back-gige = ["dep:vgige-back-gige"]
back-u3v = ["dep:vgige-back-u3v"]
front-gige = ["dep:vgige-front-gige"]
front-u3v = ["dep:vgige-front-u3v"]

[dependencies]
vgige-core = { path = "../vgige-core" }
vgige-back-gige = { path = "../vgige-back-gige", optional = true }
vgige-back-u3v = { path = "../vgige-back-u3v", optional = true }
vgige-front-gige = { path = "../vgige-front-gige", optional = true }
vgige-front-u3v = { path = "../vgige-front-u3v", optional = true }
gentl-core = { path = "../../crates/gentl-core" }
gentl-gvcp = { path = "../../crates/gentl-gvcp" }

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGTERM shutdown flag (src/signal.rs) and getifaddrs NIC lookup
# (src/netid.rs); same standing as gentl-gige's unix backend (notes/PENDING.md
# "Linux 可移植").
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Up-facing NIC MAC lookup via GetAdaptersAddresses (src/netid.rs), same API
# family gentl-gige uses for its Windows enumeration. Ndis is required by
# windows-sys 0.59 for IP_ADAPTER_ADDRESSES_LH (the adapter struct's cfg).
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
] }

[dev-dependencies]
# tests/relay_e2e.rs: the simulator plays the real camera; no hardware needed.
gentl-simulator = { path = "../../crates/gentl-simulator" }
# Test binaries are their own link units: the U3V suites build the fake
# GenCP device on the client facade's UsbPipe, and the GigE suites use
# back-gige — neither links both GenTL producers into one image (see
# [features]). Both fronts/backs are listed here so every test builds
# under any feature combination of the library itself.
gentl-u3v = { path = "../../crates/gentl-u3v" }
vgige-back-gige = { path = "../vgige-back-gige" }
vgige-back-u3v = { path = "../vgige-back-u3v" }
vgige-front-gige = { path = "../vgige-front-gige" }
