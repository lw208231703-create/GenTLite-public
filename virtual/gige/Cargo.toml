[package]
name = "vgige-front-gige"
description = "vgige front-end adapter for GigE Vision clients (GvcpServer device handler + GVSP 3.0 encoding FrameSession)"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
vgige-core = { path = "../../gateway/core" }
gentl-core = { path = "../../gentl/core" }
gentl-gvcp = { path = "../../gentl/gvcp" }

[target.'cfg(unix)'.dependencies]
# IP_MTU_DISCOVER for the DF bit on GVSP test packets (§11.7).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# IP_DONTFRAGMENT for GVSP test packets (§11.7).
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }
